<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT &amp; FIGHT CLUB — Ops Console</title>
<meta name="description" content="Multi-branch gym CRM prototype for FIT & FIGHT CLUB — leads, trials, members, memberships, payments, scheduling, attendance and reports.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FIT & FIGHT CLUB — CRM console
   Design tokens — dark, red-accent brand palette
   ============================================================ */
:root{
  color-scheme: dark;

  /* surfaces */
  --page:        #111216;
  --surface:     #1A1C22;
  --surface-2:   #22242C;
  --surface-3:   #2A2D36;

  /* ink */
  --ink:         #EDEEF2;
  --ink-2:       #9AA0AC;
  --ink-3:       #6B7080;

  /* structure */
  --gridline:    #31343E;
  --baseline:    #3D404B;
  --border:      #31343E;
  --border-strong: #3D404B;
  --shadow: 0 1px 2px rgba(0,0,0,0.35);

  /* brand accent — used sparingly for primary actions & the active state */
  --brass:       #B72F1E;
  --brass-ink:   #FF7B67;
  --brass-fill:  #E8402B;
  --brass-soft:  rgba(232,64,43,0.15);
  --brass-on:    #ffffff;

  /* branch categorical */
  --br-vashi:    #4FA3E3;
  --br-nerul:    #A78BFA;
  --br-wagholi:  #3ECF8E;

  /* status (fixed, never themed) */
  --st-good:     #3ECF8E;
  --st-warning:  #F0A93E;
  --st-warning-fill: #F0A93E;
  --st-serious:  #B72F1E;
  --st-serious-fill: #B72F1E;
  --st-critical: #E8402B;

  --radius-sm: 3px;
  --radius-md: 5px;
  --radius-lg: 6px;
  --nav-w: 224px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{ margin:0; text-wrap:balance; }
p{ margin:0; }
a{ color:inherit; }
button{ font-family:inherit; }
::selection{ background:var(--brass-soft); color:var(--brass-ink); }

.disp{
  font-family:"Oswald", "Inter", sans-serif;
  font-weight:600;
  letter-spacing:0.01em;
  line-height:1;
}
.mono{
  font-family:"Inter", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
}
.eyebrow{
  font-family:"Inter", system-ui, sans-serif;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--ink-3);
}

/* scrollbars */
*{ scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

:focus-visible{ outline:2px solid var(--brass-fill); outline-offset:2px; border-radius:4px; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ============================================================
   App shell
   ============================================================ */
.app{ display:flex; min-height:100vh; }

.nav{
  width:var(--nav-w); flex:0 0 auto;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.nav-brand{
  padding:20px 18px 14px;
  border-bottom:1px solid var(--border);
}
.nav-brand .mark{
  display:flex; align-items:center; gap:9px;
}
.nav-brand .knot{
  width:30px; height:30px; border-radius:6px;
  background:var(--brass-fill);
  display:flex; align-items:center; justify-content:center;
  color:var(--brass-on); font-family:"Oswald"; font-size:14px; font-weight:700; flex:0 0 auto;
}
.nav-brand .word{ font-size:18px; letter-spacing:0.02em; }
.nav-brand .word b{ color:var(--brass-ink); }
.nav-brand .sub{ margin-top:2px; font-size:10.5px; color:var(--ink-3); font-family:"Inter"; letter-spacing:.05em;}

.nav-section-label{
  padding:14px 18px 6px; font-size:10px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3);
}
.nav-list{ list-style:none; margin:0; padding:2px 10px; display:flex; flex-direction:column; gap:1px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--ink-2); font-size:13.5px; font-weight:500;
  border:1px solid transparent; background:none; width:100%; text-align:left;
}
.nav-item .ic{ width:17px; height:17px; flex:0 0 auto; opacity:.85; }
.nav-item:hover{ background:var(--surface-2); color:var(--ink); }
.nav-item.active{
  background:var(--brass-soft); color:var(--brass-ink); font-weight:600;
}

.nav-foot{
  margin-top:auto; padding:12px 18px 16px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:9px;
}
.nav-foot .avatar{
  width:28px;height:28px;border-radius:50%; background:var(--surface-2); border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; color:var(--ink-2);
}
.nav-foot .who{ font-size:12.5px; font-weight:600; }
.nav-foot .role{ font-size:10.5px; color:var(--ink-3); }

.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }

.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--page); border-bottom:1px solid var(--border);
  padding:14px 26px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.topbar h1{ font-size:24px; }
.topbar .today{ font-size:11.5px; color:var(--ink-3); font-family:"Inter"; }
.topbar-spacer{ flex:1 1 auto; }

.chiprow{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border-radius:999px; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-2); font-size:12.5px; font-weight:500;
  cursor:pointer; white-space:nowrap;
}
.chip:hover{ border-color:var(--brass-fill); }
.chip.on{ background:var(--brass-fill); color:var(--brass-on); border-color:var(--brass-fill); }
.chip .dot{ width:8px;height:8px;border-radius:50%; }

select.uisel, .uisel{
  padding:7px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:500; font-family:inherit;
}
.iconbtn{
  width:34px;height:34px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.iconbtn:hover{ color:var(--ink); border-color:var(--brass-fill); }

.btn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:12.5px;
  font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn:hover{ border-color:var(--brass-fill); opacity:.9; }
.btn.primary{ background:var(--brass-fill); border-color:var(--brass-fill); color:var(--brass-on); }
.btn.primary:hover{ filter:brightness(1.08); opacity:1; }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.danger{ color:var(--st-critical); border-color:var(--brass); }
.btn.sm{ padding:5px 10px; font-size:11.5px; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }

.view{ padding:22px 26px 60px; max-width:1440px; }
.view-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.view-head h2{ font-size:15px; font-weight:700; }
.view-head .desc{ color:var(--ink-3); font-size:12.5px; margin-top:2px; }

/* ============================================================
   Cards / grids
   ============================================================ */
.grid{ display:grid; gap:14px; }
.grid.cols-4{ grid-template-columns:repeat(4,1fr); }
.grid.cols-3{ grid-template-columns:repeat(3,1fr); }
.grid.cols-2{ grid-template-columns:repeat(2,1fr); }
@media (max-width:1180px){ .grid.cols-4{ grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:720px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{ grid-template-columns:1fr; } }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.card .cardhead{
  padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.card .cardhead h3{ font-size:13px; font-weight:700; }
.card .cardhead .desc{ font-size:11.5px; color:var(--ink-3); margin-top:1px; }
.card .cardbody{ padding:16px; }
.card .cardbody.flush{ padding:0; }

.stat{
  padding:16px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border);
  box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.stat::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--stripe,var(--border-strong)); }
.stat .lbl{ font-size:11px; color:var(--ink-3); font-weight:600; letter-spacing:.02em; }
.stat .val{ font-family:"Oswald"; font-weight:600; font-size:27px; margin-top:6px; letter-spacing:0.01em; }
.stat .sub{ margin-top:5px; font-size:11.5px; color:var(--ink-3); display:flex; align-items:center; gap:5px; }
.stat .sub.good{ color:var(--st-good); }
.stat .sub.warning{ color:var(--st-warning); }
.stat .sub.critical{ color:var(--st-critical); }

/* ============================================================
   Table
   ============================================================ */
.tablewrap{ overflow-x:auto; }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.8px; min-width:640px; }
table.tbl thead th{
  text-align:left; padding:9px 14px; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--ink-3); border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--surface);
}
table.tbl tbody td{ padding:11px 14px; border-bottom:1px solid var(--gridline); vertical-align:middle; }
table.tbl tbody tr:last-child td{ border-bottom:none; }
table.tbl tbody tr:hover{ background:var(--surface-2); }
table.tbl td.num, table.tbl th.num{ text-align:right; font-family:"Inter"; font-variant-numeric:tabular-nums; }
.rowactions{ display:flex; gap:6px; justify-content:flex-end; }

.name-cell{ display:flex; align-items:center; gap:9px; }
.avatar-sm{
  width:28px;height:28px;border-radius:50%; background:var(--surface-3); border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700; color:var(--ink-2); flex:0 0 auto;
}
.name-cell .nm{ font-weight:600; }
.name-cell .sm{ font-size:11px; color:var(--ink-3); }

/* pills */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 7px; border-radius:999px;
  font-size:11px; font-weight:600; white-space:nowrap; border:1px solid transparent;
}
.pill .dot{ width:6px;height:6px;border-radius:50%; flex:0 0 auto; }
.pill.good{ background:rgba(62,207,142,0.15); color:var(--st-good); }
.pill.warning{ background:rgba(240,169,62,0.16); color:var(--st-warning); }
.pill.serious{ background:rgba(183,47,30,0.20); color:#FF9587; }
.pill.critical{ background:rgba(232,64,43,0.16); color:var(--st-critical); }
.pill.neutral{ background:var(--surface-2); color:var(--ink-2); border-color:var(--border); }
.pill.brand{ background:var(--brass-soft); color:var(--brass-ink); }

.branch-tag{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2); }
.branch-tag .dot{ width:8px;height:8px;border-radius:50%; flex:0 0 auto; }

/* pipeline */
.pipe{ display:flex; flex-wrap:wrap; gap:6px; }
.pipe .seg{
  padding:4px 10px; border-radius:999px; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
  border:1px solid var(--border); color:var(--ink-3); background:var(--surface);
}
.pipe .seg.on{ background:var(--brass-fill); color:var(--brass-on); border-color:var(--brass-fill); }

/* forms */
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
.form-grid .full{ grid-column:1/-1; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px; }
.field .hint{ font-size:10.5px; color:var(--ink-3); margin-top:4px; }
.field input, .field select, .field textarea{
  width:100%; padding:9px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--page); color:var(--ink); font-size:13px; font-family:inherit;
}
.field textarea{ resize:vertical; min-height:64px; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brass-fill); outline-offset:1px; border-color:var(--brass-fill); }
.checkfield{ display:flex; align-items:center; gap:8px; }
.checkfield input{ width:auto; }

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(6,6,8,0.65); backdrop-filter:blur(1.5px);
  display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
}
.overlay[hidden]{ display:none; }
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow);
  width:100%; max-width:640px; margin-bottom:5vh;
}
.modal .mhead{ padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal .mhead h3{ font-size:15px; }
.modal .mbody{ padding:18px 20px; max-height:64vh; overflow-y:auto; }
.modal .mfoot{ padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }
.xbtn{ width:28px;height:28px; border-radius:50%; border:none; background:var(--surface-2); color:var(--ink-2); cursor:pointer; }

/* toast */
#toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(8px); opacity:0;
  background:var(--brass-fill); color:var(--brass-on); padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600;
  box-shadow:var(--shadow); z-index:200; pointer-events:none; transition:opacity .18s, transform .18s;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ padding:40px 20px; text-align:center; color:var(--ink-3); font-size:12.5px; }

.divider{ height:1px; background:var(--border); margin:16px 0; }
.hairline-list{ list-style:none; margin:0; padding:0; }
.hairline-list li{ padding:10px 0; border-bottom:1px solid var(--border); }
.hairline-list li:last-child{ border-bottom:none; }

.kv{ display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--gridline); font-size:12.5px; }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--ink-3); }
.kv .v{ font-weight:600; text-align:right; }

.barh{ display:flex; align-items:center; gap:10px; }
.barh .track{ flex:1 1 auto; height:8px; background:var(--surface-2); border-radius:6px; overflow:hidden; border:1px solid var(--border); }
.barh .fill{ height:100%; border-radius:6px; }
.barh .amt{ font-family:"Inter"; font-size:11.5px; width:64px; text-align:right; flex:0 0 auto; font-variant-numeric:tabular-nums; }

.legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
.legend .li{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2); }
.legend .sw{ width:10px;height:10px;border-radius:3px; }

.taglist{ display:flex; gap:5px; flex-wrap:wrap; }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; }
.tabs button{
  padding:9px 4px; margin-right:16px; background:none; border:none; border-bottom:2px solid transparent;
  color:var(--ink-3); font-weight:600; font-size:12.8px; cursor:pointer;
}
.tabs button.on{ color:var(--ink); border-color:var(--brass-fill); }

.searchbox{ position:relative; }
.searchbox input{
  padding:7px 10px 7px 30px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--surface); font-size:12.5px; width:220px; color:var(--ink);
}
.searchbox svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; }

.role-banner{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--radius-md);
  background:var(--brass-soft); color:var(--brass-ink); font-size:12px; font-weight:600; margin-bottom:16px;
}

@media (max-width:900px){
  .nav{ position:fixed; z-index:60; transform:translateX(-100%); transition:transform .18s; box-shadow:var(--shadow); }
  .nav.open{ transform:translateX(0); }
  .view{ padding:16px; }
  .topbar{ padding:12px 16px; }
}

</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="navRail">
    <div class="nav-brand">
      <div class="mark">
        <div class="knot">F&amp;F</div>
        <div>
          <div class="word disp">FIT <b>&amp;</b> FIGHT<br>CLUB</div>
        </div>
      </div>
      <div class="sub">OPS CONSOLE &middot; VASHI / NERUL / WAGHOLI</div>
    </div>

    <div class="nav-section-label">Grow</div>
    <ul class="nav-list" id="navGrow"></ul>

    <div class="nav-section-label">Members</div>
    <ul class="nav-list" id="navMembers"></ul>

    <div class="nav-section-label">Operate</div>
    <ul class="nav-list" id="navOperate"></ul>

    <div class="nav-section-label">Engage</div>
    <ul class="nav-list" id="navComms"></ul>

    <div class="nav-section-label">Insight</div>
    <ul class="nav-list" id="navInsight"></ul>

    <div class="nav-foot">
      <div class="avatar" id="whoAvatar">FA</div>
      <div>
        <div class="who" id="whoName">Founder / Admin</div>
        <div class="role" id="whoRole">All-access</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn" id="navToggle" style="display:none" title="Menu" aria-label="Toggle navigation">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div>
        <h1 class="disp" id="pageTitle">Dashboard</h1>
        <div class="today" id="pageToday"></div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="chiprow" id="branchFilterRow"></div>
      <select class="uisel" id="roleSelect" title="View as role"></select>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true">
    <div class="mhead">
      <h3 id="modalTitle">Title</h3>
      <button class="xbtn" id="modalClose" aria-label="Close">&times;</button>
    </div>
    <div class="mbody" id="modalBody"></div>
    <div class="mfoot" id="modalFoot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   FIT & FIGHT CLUB — seed data
   Anchor date is fixed so the demo reads sensibly regardless of
   when it's actually opened.
   ============================================================ */
const TODAY = new Date(2026, 7, 31); // 31 Aug 2026 (Mon)
const DAY = 86400000;
function d(offset, h, m){ const x = new Date(TODAY.getTime()+offset*DAY); if(h!=null) x.setHours(h, m||0,0,0); return x; }
function iso(dt){ return dt.toISOString().slice(0,10); }
function isoT(dt){ return dt.toISOString().slice(0,16); }
let _uid = 1000;
function uid(pfx){ return pfx + (_uid++); }
function fmtDate(s){ if(!s) return "—"; const x=new Date(s); if(isNaN(x)) return s; return x.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtDateShort(s){ if(!s) return "—"; const x=new Date(s); if(isNaN(x)) return s; return x.toLocaleDateString("en-IN",{day:"2-digit",month:"short"}); }
function fmtTime(s){ if(!s) return ""; const [h,m]=String(s).split(":").map(Number); const dt=new Date(); dt.setHours(h,m||0); return dt.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}); }
function fmtMoney(n){ if(n==null||isNaN(n)) return "—"; return "₹" + Math.round(n).toLocaleString("en-IN"); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/DAY); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ return String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }

/* ============================================================
   Persistence — clone seed into a mutable store, keep in
   localStorage per-viewer so edits in this browser stick.
   ============================================================ */
const SEED = { LEADS, TRIALS, MEMBERS, MEMBERSHIPS, PAYMENTS, CLASSES, ATTENDANCE, TASKS };
const LS_KEY = "ffc_crm_v1";
let DB;
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ /* storage unavailable or corrupt — fall back to seed */ }
  return JSON.parse(JSON.stringify(SEED));
}
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){ /* ignore quota/availability errors */ }
}
function resetDB(){
  DB = JSON.parse(JSON.stringify(SEED));
  saveDB();
  toast("Sample data reset");
  render();
}
DB = loadDB();

function memberById(id){ return DB.MEMBERS.find(m=>m.id===id); }
function leadById(id){ return DB.LEADS.find(l=>l.id===id); }
function membershipById(id){ return DB.MEMBERSHIPS.find(m=>m.id===id); }
function classById(id){ return CLASSES.find(c=>c.id===id); }
function activeMembershipFor(memberId){
  const list = DB.MEMBERSHIPS.filter(m=>m.memberId===memberId);
  return list.sort((a,b)=> new Date(b.end)-new Date(a.end))[0];
}
function membershipComputedStatus(ms){
  if(!ms) return "—";
  const endsIn = daysBetween(TODAY, ms.end);
  if(ms.status==="Frozen") return "Frozen";
  if(endsIn < 0) return "Expired";
  if(endsIn <= 7) return "Expiring soon";
  if(endsIn <= 30) return "Renewal due";
  return "Active";
}
function statusToneForMembership(s){
  return { "Active":"good","Renewal due":"warning","Expiring soon":"serious","Expired":"critical","Frozen":"neutral" }[s] || "neutral";
}
function paymentBalance(p){ return Math.max(0, (p.amount||0) - (p.paid||0)); }

function openModal({title, bodyHTML, footHTML, onMount}){
  document.getElementById("modalTitle").textContent = title;
  document.getElementById("modalBody").innerHTML = bodyHTML;
  document.getElementById("modalFoot").innerHTML = footHTML || "";
  document.getElementById("overlay").hidden = false;
  if(onMount) onMount();
}

}

function pill(text, tone){
  return `<span class="pill ${tone||'neutral'}"><span class="dot" style="background:currentColor"></span>${esc(text)}</span>`;
}
function branchTag(key){
  const b = branch(key); if(!b) return "—";
  return `<span class="branch-tag"><span class="dot" style="background:${b.color}"></span>${b.name}</span>`;
}
function avatarSm(name){ return `<div class="avatar-sm">${esc(initials(name))}</div>`; }

function fieldHTML(f, val){
  val = val==null? "": val;
  const id = "f_"+f.key;
  if(f.type==="select"){
    const opts = f.options.map(o=>{
      const ov = typeof o==="object"? o.value : o;
      const ol = typeof o==="object"? o.label : o;
      return `<option value="${esc(ov)}" ${String(ov)===String(val)?"selected":""}>${esc(ol)}</option>`;
    }).join("");
    return `<div class="field ${f.full?'full':''}"><label for="${id}">${esc(f.label)}</label><select id="${id}" name="${f.key}" ${f.required?"required":""}>${opts}</select>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
  }
  if(f.type==="textarea"){
    return `<div class="field full"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" name="${f.key}" ${f.required?"required":""}>${esc(val)}</textarea>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
  }
  if(f.type==="checkbox"){
    return `<div class="field ${f.full?'full':''}"><div class="checkfield"><input type="checkbox" id="${id}" name="${f.key}" ${val?"checked":""}/><label for="${id}" style="margin:0">${esc(f.label)}</label></div></div>`;
  }
  return `<div class="field ${f.full?'full':''}"><label for="${id}">${esc(f.label)}</label><input type="${f.type||'text'}" id="${id}" name="${f.key}" value="${esc(val)}" ${f.required?"required":""} ${f.step?`step="${f.step}"`:""}/>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}
function openForm({title, fields, initial, submitLabel, onSubmit}){
  initial = initial || {};
  const body = `<form id="genForm"><div class="form-grid">${fields.map(f=>fieldHTML(f, initial[f.key])).join("")}</div></form>`;
  const foot = `<button class="btn ghost" id="genCancel" type="button">Cancel</button><button class="btn primary" id="genSubmit" type="submit" form="genForm">${esc(submitLabel||"Save")}</button>`;
  openModal({ title, bodyHTML: body, footHTML: foot, onMount(){
    document.getElementById("genCancel").addEventListener("click", closeModal);
    document.getElementById("genForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const out = {};
      fields.forEach(f=>{
        const el = document.getElementById("f_"+f.key);
        if(f.type==="checkbox") out[f.key] = el.checked;
        else if(f.type==="number") out[f.key] = el.value===""? null : Number(el.value);
        else out[f.key] = el.value;
      });
      onSubmit(out);
      closeModal();
    });
  }});
}

/* ============================================================
   Branch stats (used by Dashboard + Reports)
   ============================================================ */
function inBranch(list, key, field){
  field = field || "branch";
  return key==="all" ? list : list.filter(x=>x[field]===key);
}
function memberBranch(memberId){ const m=memberById(memberId); return m? m.branch : null; }
function sameMonth(dateStr, ref){ const x=new Date(dateStr); return x.getFullYear()===ref.getFullYear() && x.getMonth()===ref.getMonth(); }

function computeBranchStats(key){
  const leads = inBranch(DB.LEADS, key);
  const trials = inBranch(DB.TRIALS, key);
  const enquiriesToday = leads.filter(l=>l.createdAt===iso(TODAY)).length;
  const trialsToday = trials.filter(t=>t.date===iso(TODAY)).length;

  const memberIdsInBranch = new Set(DB.MEMBERS.filter(m=> key==="all" || m.branch===key).map(m=>m.id));
  const membershipsInBranch = DB.MEMBERSHIPS.filter(ms=>memberIdsInBranch.has(ms.memberId));
  const conversionsThisMonth = membershipsInBranch.filter(ms=>sameMonth(ms.start, TODAY)).length;

  const activeMemberIds = new Set();
  memberIdsInBranch.forEach(id=>{ const ms=activeMembershipFor(id); if(ms && membershipComputedStatus(ms)!=="Expired") activeMemberIds.add(id); });
  const activeMembers = activeMemberIds.size;

  let expiring7=0, expiring30=0;
  memberIdsInBranch.forEach(id=>{ const ms=activeMembershipFor(id); if(!ms) return; const s=membershipComputedStatus(ms);
    if(s==="Expiring soon") expiring7++; if(s==="Renewal due") expiring30++; });

  const paymentsInBranch = DB.PAYMENTS.filter(p=>memberIdsInBranch.has(p.memberId));
  const overdue = paymentsInBranch.filter(p=> (p.status==="Overdue" || p.status==="Partial") && paymentBalance(p)>0);
  const overdueAmt = overdue.reduce((s,p)=>s+paymentBalance(p),0);

  const attendanceInBranch = DB.ATTENDANCE.filter(a=>memberIdsInBranch.has(a.memberId) && a.date===iso(TODAY));
  const present = attendanceInBranch.filter(a=>a.status==="Present"||a.status==="Late").length;
  const noshow = attendanceInBranch.filter(a=>a.status==="No-show").length;

  const revenueMonth = paymentsInBranch.filter(p=>sameMonth(p.date, TODAY)).reduce((s,p)=>s+(p.paid||0),0);
  const revenueTotal = paymentsInBranch.reduce((s,p)=>s+(p.paid||0),0);

  return { key, enquiriesToday, trialsToday, conversionsThisMonth, activeMembers, expiring7, expiring30,
    overdueCount:overdue.length, overdueAmt, present, noshow, revenueMonth, revenueTotal,
    classesToday: inBranch(CLASSES, key).filter(c=>c.dow.includes(TODAY.getDay())).length };
}

  const p = DB.PAYMENTS.find(x=>x.id===id); if(!p) return;
  const bal = paymentBalance(p);
  openForm({ title:"Record payment", fields:[
      { key:"amount", label:`Amount received (balance ${fmtMoney(bal)})`, type:"number", required:true },
      { key:"mode", label:"Payment mode", type:"select", options:PAY_MODES, required:true },
    ], initial:{amount:bal}, submitLabel:"Record payment",
    onSubmit(v){
      p.paid = Math.min(p.amount, (p.paid||0) + Number(v.amount||0));
      p.mode = v.mode;
      p.status = p.paid>=p.amount ? "Paid" : "Partial";
      if(p.status==="Paid" && !p.receipt) p.receipt = "RCPT-" + branch(memberById(p.memberId).branch).name.slice(0,3).toUpperCase() + "-" + p.id.slice(-4);
      saveDB(); toast("Payment recorded"); render();

ACTIONS.checkIn = function(){

RENDERERS.attendance = function(){
  document.getElementById("viewActions").innerHTML = `<button class="btn primary" data-action="checkIn">+ Check in</button>`;

  let rows = DB.ATTENDANCE.filter(a=>a.date===STATE.attDay).map(a=>({a, mm:memberById(a.memberId)})).filter(x=>x.mm && (STATE.branch==="all"||x.mm.branch===STATE.branch));

  document.getElementById("viewBody").innerHTML = `

/* ============================================================
   REPORTS
   ============================================================ */
RENDERERS.reports = function(){
  const leads = inBranch(DB.LEADS, STATE.branch);
  const trials = inBranch(DB.TRIALS, STATE.branch);
  const totalLeads = leads.length;
  const trialBooked = trials.length;
  const trialAttended = trials.filter(t=>t.attendance==="Attended").length;
  const converted = leads.filter(l=>["Member active","Renewed"].includes(l.status)).length;
  const leadToTrial = totalLeads? Math.round(trialBooked/totalLeads*100) : 0;
  const trialToMember = trialAttended? Math.round(converted/trialAttended*100) : 0;

  const memberIds = new Set(DB.MEMBERS.filter(m=>STATE.branch==="all"||m.branch===STATE.branch).map(m=>m.id));
  const msInScope = DB.MEMBERSHIPS.filter(ms=>memberIds.has(ms.memberId));
  const expiredCount = msInScope.filter(ms=>membershipComputedStatus(ms)==="Expired").length;
  const churn = msInScope.length? Math.round(expiredCount/msInScope.length*100) : 0;

  const payInScope = DB.PAYMENTS.filter(p=>memberIds.has(p.memberId));
  const dues = payInScope.filter(p=>["Overdue","Partial"].includes(p.status)).reduce((s,p)=>s+paymentBalance(p),0);
  const revenueTotal = payInScope.reduce((s,p)=>s+p.paid,0);

  const attToday = DB.ATTENDANCE.filter(a=>a.date===iso(TODAY) && memberIds.has(a.memberId));
  const attRate = attToday.length? Math.round(attToday.filter(a=>a.status!=="No-show").length/attToday.length*100) : 0;

  const branchRevenue = BRANCHES.map(b=>({b, val: DB.PAYMENTS.filter(p=>{const mm=memberById(p.memberId); return mm&&mm.branch===b.key;}).reduce((s,p)=>s+p.paid,0)}));
  const maxBranchRev = Math.max(...branchRevenue.map(x=>x.val),1);

  const coachStats = coaches(STATE.branch==="all"?null:STATE.branch).map(c=>{
    const cls = CLASSES.filter(x=>x.coach===c.id);
    const cap = cls.reduce((s,x)=>s+x.capacity,0), booked = cls.reduce((s,x)=>s+x.booked,0);
    return { c, pct: cap? Math.round(booked/cap*100) : 0, classCount: cls.length };
  }).sort((a,b)=>b.pct-a.pct);

  const progStats = PROGRAMS.map(pr=>{
    const mIds = new Set(DB.MEMBERS.filter(m=>m.program===pr && (STATE.branch==="all"||m.branch===STATE.branch)).map(m=>m.id));
    const rev = DB.PAYMENTS.filter(p=>mIds.has(p.memberId)).reduce((s,p)=>s+p.paid,0);
    return { pr, members: mIds.size, rev };
  });
  const maxProgRev = Math.max(...progStats.map(x=>x.rev),1);

  document.getElementById("viewBody").innerHTML = `
    <div class="grid cols-4">
      <div class="stat"><div class="lbl">Lead → trial</div><div class="val mono">${leadToTrial}%</div><div class="sub">${trialBooked} of ${totalLeads} leads booked a trial</div></div>
      <div class="stat"><div class="lbl">Trial → membership</div><div class="val mono">${trialToMember}%</div><div class="sub">${converted} of ${trialAttended} attended trials converted</div></div>
      <div class="stat"><div class="lbl">Attendance rate — today</div><div class="val mono">${attRate}%</div><div class="sub">${attToday.length} check-ins logged</div></div>
      <div class="stat" style="--stripe:${churn>15?'var(--st-critical)':'var(--border-strong)'}"><div class="lbl">Churn (expired / total)</div><div class="val mono">${churn}%</div><div class="sub ${churn>15?'critical':''}">${expiredCount} of ${msInScope.length} memberships</div></div>
    </div>

    <div class="grid cols-2" style="margin-top:14px;align-items:start">
      <div class="card"><div class="cardhead"><div><h3>Revenue by branch — all time</h3></div></div>
        <div class="cardbody">
          ${branchRevenue.map(x=>`<div class="barh" style="margin-bottom:10px"><div style="width:66px;font-size:12px;font-weight:600">${x.b.name}</div><div class="track"><div class="fill" style="width:${Math.max(4,x.val/maxBranchRev*100)}%;background:${x.b.color}"></div></div><div class="amt">${fmtMoney(x.val)}</div></div>`).join("")}
          <div class="divider"></div>
          <div class="kv"><span class="k">Total revenue (scope)</span><span class="v mono">${fmtMoney(revenueTotal)}</span></div>
          <div class="kv"><span class="k">Outstanding dues (scope)</span><span class="v mono" style="${dues?'color:var(--st-critical)':''}">${fmtMoney(dues)}</span></div>
        </div>
      </div>
      <div class="card"><div class="cardhead"><div><h3>Program performance</h3><div class="desc">Members and revenue by program, this scope</div></div></div>
        <div class="cardbody">
          ${progStats.map(x=>`<div class="barh" style="margin-bottom:10px"><div style="width:110px;font-size:12px;font-weight:600">${x.pr}</div><div class="track"><div class="fill" style="width:${Math.max(4,x.rev/maxProgRev*100)}%;background:var(--brass-fill)"></div></div><div class="amt">${fmtMoney(x.rev)}</div></div>`).join("")}
          <div class="legend">${progStats.map(x=>`<div class="li"><span class="sw" style="background:var(--brass-fill)"></span>${x.pr}: ${x.members} members</div>`).join("")}</div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:14px"><div class="cardhead"><div><h3>Coach utilisation</h3><div class="desc">Booked seats ÷ capacity across each coach's classes</div></div></div>
      <div class="cardbody flush"><div class="tablewrap"><table class="tbl">
        <thead><tr><th>Coach</th><th>Branch</th><th>Classes</th><th>Utilisation</th></tr></thead>
        <tbody>${coachStats.map(x=>`<tr>
          <td class="name-cell">${avatarSm(x.c.name)}<div class="nm">${esc(x.c.name)}</div></td>
          <td>${branchTag(x.c.branch)}</td>
          <td class="num">${x.classCount}</td>
          <td style="min-width:160px"><div class="barh"><div class="track"><div class="fill" style="width:${x.pct}%;background:${x.pct>=90?'var(--st-warning-fill)':'var(--st-good)'}"></div></div><div class="amt">${x.pct}%</div></div></td>
        </tr>`).join("") || `<tr><td colspan="4"><div class="empty">No coaches in this scope.</div></td></tr>`}</tbody>
      </table></div></div>
    </div>
  `;
};

/* ============================================================
   ADMIN & PERMISSIONS
   ============================================================ */
RENDERERS.admin = function(){
  document.getElementById("viewActions").innerHTML = `<button class="btn danger" data-action="resetData">Reset sample data</button>`;
  const roles = Object.keys(ROLE_LABELS);
  const allModules = NAV.flatMap(s=>s.items);
  const staffCounts = {}; roles.forEach(r=>staffCounts[r]=STAFF.filter(s=>s.role===r).length);

  document.getElementById("viewBody").innerHTML = `
    <div class="grid cols-4" style="margin-bottom:14px">
      ${roles.map(r=>`<div class="stat"><div class="lbl">${ROLE_LABELS[r]}</div><div class="val mono">${staffCounts[r]}</div><div class="sub">team member${staffCounts[r]===1?"":"s"}</div></div>`).join("")}
    </div>
    <div class="card"><div class="cardhead"><div><h3>What each role can see</h3><div class="desc">Founder/Admin has full access; every other role is scoped to what its job needs. Switch “View as role” in the top bar to preview.</div></div></div>
      <div class="cardbody flush"><div class="tablewrap"><table class="tbl">
        <thead><tr><th>Module</th>${roles.map(r=>`<th style="text-align:center">${ROLE_LABELS[r]}</th>`).join("")}</tr></thead>
        <tbody>${allModules.map(m=>`<tr><td>${esc(m.label)}</td>${roles.map(r=>{
          const allowed = ROLE_VIEWS[r];
          const has = !allowed || allowed.includes(m.key);
          return `<td style="text-align:center">${has? `<span style="color:var(--st-good);font-weight:700">✓</span>` : `<span style="color:var(--ink-3)">–</span>`}</td>`;
        }).join("")}</tr>`).join("")}</tbody>
      </table></div></div>
    </div>
    <div class="card" style="margin-top:14px"><div class="cardhead"><div><h3>Data scope by branch</h3><div class="desc">Branch managers, receptionists, coaches and the accountant see figures for their assigned branch only when a branch role account is used; the founder/admin can view any branch or “All branches”.</div></div></div>
      <div class="cardbody">
        <div class="kv"><span class="k">This is a prototype</span><span class="v">Edits save to this browser only (localStorage), so they persist on reload here but aren't shared with anyone else.</span></div>
        <div class="kv"><span class="k">Data lives</span><span class="v">In this browser's local storage — nothing is sent to a server.</span></div>
      </div>
    </div>
  `;
};
ACTIONS.resetData = function(){ if(confirm("Reset all demo data back to the original sample set? Your edits in this browser will be lost.")) resetDB(); };

/* ============================================================
   Init
   ============================================================ */
render();

</script>
</body>
</html>
